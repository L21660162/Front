query GetAllPeriods($filter: PeriodArgs, $limit: Int, $offset: Int, $page: Int) {
  getAllPeriods(filter: $filter, limit: $limit, offset: $offset, page: $page) {
    docs {
      _id
      createdAt
      deletedAt
      finalDate
      isDeleted
      largeIdentifier
      name
      shortIdentifier
      startDate
      updatedAt
    }
    hasNextPage
    hasPrevPage
    limit
    nextPage
    offset
    page
    pagingCounter
    prevPage
    totalDocs
    totalPages
  }
}

query GetPeriodById($id: ID) {
  getPeriodById(_id: $id) {
    _id
    createdAt
    deletedAt
    finalDate
    isDeleted
    largeIdentifier
    name
    shortIdentifier
    startDate
    updatedAt
  }
}