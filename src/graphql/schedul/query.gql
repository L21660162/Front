query GetAllSchedules($filter: ScheduleArgs, $limit: Int, $offset: Int, $page: Int, $sort: JSON) {
  getAllSchedules(filter: $filter, limit: $limit, offset: $offset, page: $page, sort: $sort) {
    docs {
      _id
      classroom
      createdAt
      deletedAt
      finalTime
      classGroup
      isDeleted
      period
      teacher
      startTime
      subject
      updatedAt
      weekday
    }
  }
}

query GetScheduleById($id: ID) {
  getScheduleById(_id: $id) {
    _id
    classroom
    createdAt
    deletedAt
    finalTime
    classGroup
    isDeleted
    period
    teacher
    weekday
    startTime
    subject
    updatedAt
  }
}

query GetSchedulesFormatted($teacher: ID) {
  getSchedulesFormatted(teacher: $teacher) {
    _id
    classroomIdentifier
    finalTime
    groupIdentifier
    startTime
    subjectLargeName
    subjectShortName
    teacherFirstName
    teacherLastName
    teacherMiddleName
    teacherRfc
    weekday
  }
}