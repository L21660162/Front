query GetAllClassrooms($filter: ClassroomArgs, $limit: Int, $offset: Int, $page: Int) {
  getAllClassrooms(filter: $filter, limit: $limit, offset: $offset, page: $page) {
    docs {
      _id
      building
      createdAt
      deletedAt
      identifier
      isDeleted
      updatedAt
    }
    hasNextPage
    hasPrevPage
    limit
    nextPage
    offset
    page
    pagingCounter
    prevPage
    totalDocs
    totalPages
  }
}

query GetClassroomById($id: ID) {
  getClassroomById(_id: $id) {
    _id
    building
    createdAt
    deletedAt
    identifier
    isDeleted
    updatedAt
  }
}
