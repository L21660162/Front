query GetAllUsers($filter: UserArgs, $limit: Int, $offset: Int, $page: Int) {
  getAllUsers(filter: $filter, limit: $limit, offset: $offset, page: $page) {
    docs {
      _id
      createdAt
      deletedAt
      department
      email
      firstName
      gender
      isDeleted
      lastName
      middleName
      password
      rfc
      roles
      photo
      updatedAt
    }
    hasNextPage
    hasPrevPage
    limit
    nextPage
    offset
    page
    pagingCounter
    prevPage
    totalDocs
    totalPages
  }
}

query GetUserById($id: ID) {
  getUserById(_id: $id) {
    _id
    createdAt
    deletedAt
    department
    email
    firstName
    gender
    isDeleted
    lastName
    middleName
    password
    rfc
    roles
    photo
    updatedAt
  }
}

query Me {
  me {
    _id
    createdAt
    deletedAt
    department
    email
    firstName
    gender
    isDeleted
    lastName
    middleName
    password
    rfc
    roles
    photo
    updatedAt
  }
}
